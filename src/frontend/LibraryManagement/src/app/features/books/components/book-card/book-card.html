<app-category-filter (genreSelected)="onGenreSelected($event)" />
<h1 class="available-books">Available Books</h1>
@for(book of books(); track book.id) {
  <div class="book-card">
    <h2 class="book-card-title">{{ book.title }}</h2>
    <p class="book-info">{{ book.author }}</p>
    <p class="book-info">{{ book.genre }}</p>
    <p class="book-info">{{ book.year }}</p>
    <button [routerLink]="['/book-details', book.id]" class="book-card-button">View Details</button>
  </div>
}
